<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Build Your Crossword | Cross My Heart</title>
        <link rel="icon" type="image/svg+xml" href="./src/assets/logo.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Parisienne&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body
        class="min-h-screen before:absolute before:inset-0 before:-z-20 before:bg-[linear-gradient(rgba(42,37,35,0.045)_1px,transparent_1px),linear-gradient(90deg,rgba(42,37,35,0.045)_1px,transparent_1px)] before:bg-size-[44px_44px]"
    >
        <div id="site-header"></div>

        <main
            class="mx-6 flex min-h-[calc(100vh-10rem)] max-w-6xl flex-col gap-10 lg:mx-auto lg:gap-4"
        >
            <div
                class="mx-auto grid w-full grid-cols-1 gap-10 lg:grid-cols-[4fr_6fr]"
            >
                <section
                    class="border-border bg-surface relative rounded-lg border p-4 lg:p-8"
                >
                    <div
                        class="border-border mb-4 flex items-center justify-between border-b pb-4 lg:mb-6"
                    >
                        <h2
                            class="text-muted font-bold tracking-widest uppercase"
                        >
                            Your clues
                        </h2>
                        <span
                            id="word-count"
                            class="text-muted text-xs font-bold"
                        >
                            0 / 10 max
                        </span>
                    </div>

                    <div id="rows-container" class="space-y-3"></div>

                    <div
                        class="border-border mt-6 flex items-center justify-between gap-4 border-t pt-5"
                    >
                        <button
                            id="add-row-btn"
                            class="bg-button hover:bg-accent-hover text-accent-text bg-accent disabled:border-border disabled:text-border disabled:hover:bg-border inline-flex cursor-pointer items-center gap-2 rounded-lg px-5 py-3 text-xs font-bold transition duration-250 hover:-translate-y-0.5 active:scale-95 disabled:scale-100! disabled:cursor-not-allowed disabled:border disabled:bg-transparent disabled:hover:translate-y-0"
                        >
                            <i data-lucide="plus" class="size-4 stroke-3"></i>
                            <span>Add a clue</span>
                        </button>
                        <button
                            id="shuffle-btn"
                            class="text-muted ring-border hover:ring-accent bg-surface hover:text-accent active:ring-accent active:text-accent inline-flex cursor-pointer items-center gap-2 rounded-lg px-5 py-3 text-xs font-bold ring transition-all duration-250 ring-inset active:scale-95 active:ring-2"
                        >
                            <i data-lucide="shuffle" class="size-4"></i>
                            <span>Reorder</span>
                        </button>
                    </div>
                </section>

                <section
                    class="border-border bg-surface relative rounded-lg border p-4 lg:p-8"
                >
                    <div
                        class="border-border mb-4 flex items-center justify-between border-b pb-4 lg:mb-6"
                    >
                        <h2
                            class="text-muted font-bold tracking-widest uppercase"
                        >
                            Your finished puzzle
                        </h2>
                        <i data-lucide="heart" class="text-accent h-5 w-5"></i>
                    </div>

                    <div
                        id="grid-preview"
                        class="flex min-h-72 w-full min-w-0 items-center justify-center overflow-hidden p-3 pb-0 md:p-6 md:pb-0"
                    >
                        <p class="text-muted text-sm italic">
                            Add words to generate your crossword grid...
                        </p>
                    </div>
                </section>
            </div>
        </main>

        <div id="site-footer"></div>

        <script type="module" src="/src/builder.ts"></script>
    </body>
</html>
